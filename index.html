<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Số Tự Động - Logic Định Vị Chuẩn</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 15px;
            background-color: #0A0A0A; 
            color: #ffffff;
            margin: 0;
        }

        /* Ô gợi ý nằm trên cùng */
        .prediction-box {
            width: calc(100% - 24px);
            max-width: 356px;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 12px;
            background-color: #1A1A1A;
            border: 2px dashed #555;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            box-sizing: border-box;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        /* Hộp chứa bảng số */
        .container {
            background: #121212; 
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            margin-bottom: 25px;
            max-width: 100%;
            box-sizing: border-box;
        }

        .matrix-grid {
            display: flex;
            flex-direction: column;
            gap: 6px; 
        }

        .row {
            display: flex;
            gap: 4px; 
        }

        /* Hàng STT nổi màu Tím Đậm */
        .row-stt {
            position: sticky;
            top: 5px;
            z-index: 10;
            margin-bottom: 6px; 
        }

        .row-stt .cell {
            background-color: #1A0044;
            color: #E0AAFF; 
            font-weight: bold;
            border: 1px solid #3A0088;
        }

        /* Ô tiêu chuẩn để thẳng hàng tuyệt đối */
        .cell {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #262626;
            border-radius: 6px;
            background-color: #1A1A1A; 
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            box-sizing: border-box; 
            transition: all 0.1s ease;
        }

        @media screen and (max-width: 360px) {
            .matrix-grid { gap: 4px; }
            .row { gap: 3px; }
            .cell { width: 28px; height: 28px; font-size: 12px; }
            .prediction-box { font-size: 16px; padding: 12px; }
        }

        .row-1 .cell {
            background-color: #161616;
        }

        /* MÀU NỀN CÁC Ô TƯƠNG PHẢN CAO */
        .bg-green {
            background-color: #00FF66 !important; 
            color: #000000 !important;
            border-color: #00FF66 !important;
        }

        .bg-red {
            background-color: #FF3333 !important; 
            color: #ffffff !important;
            border-color: #FF3333 !important;
        }

        /* Khu vực nhập liệu */
        .input-area {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 0 15px;
            box-sizing: border-box;
        }

        input {
            width: 100%;
            max-width: 220px;
            padding: 12px;
            font-size: 16px; 
            background-color: #1A1A1A;
            color: #ffffff;
            border: 2px solid #00E5FF; 
            border-radius: 24px;
            text-align: center;
            outline: none;
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.2);
        }
        
        input:focus {
            border-color: #00FF66;
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.4);
        }
    </style>
</head>
<body>

    <div class="prediction-box" id="predictionBox">Chờ dữ liệu...</div>

    <div class="container">
        <div class="matrix-grid">
            <div class="row row-stt" id="rowSTT">
                <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            </div>

            <div class="row row-1" id="row1">
                <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            </div>
            
            <div class="row row-2" id="row2">
                <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            </div>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="numberInput" pattern="[0-9]*" inputmode="numeric" placeholder="Gõ số tại đây..." autofocus maxlength="1">
    </div>

    <script>
        let dataStorage = []; 
        let totalCount = 0;   

        const inputEl = document.getElementById('numberInput');
        const predictBox = document.getElementById('predictionBox');
        const sttCells = document.getElementById('rowSTT').children;
        const row1Cells = document.getElementById('row1').children;
        const row2Cells = document.getElementById('row2').children;

        window.addEventListener('DOMContentLoaded', () => {
            inputEl.focus();
        });

        inputEl.addEventListener('input', function() {
            let value = inputEl.value.trim();

            if (!/^\d$/.test(value)) {
                inputEl.value = '';
                return;
            }

            dataStorage.push({
                stt: totalCount,
                val: parseInt(value)
            });

            totalCount++; 

            if (dataStorage.length > 20) {
                dataStorage.shift(); 
            }

            clearGrid();

            // Cập nhật giao diện bảng số
            for (let i = 0; i < dataStorage.length; i++) {
                let reverseIndex = dataStorage.length - 1 - i;
                let item = dataStorage[reverseIndex];

                if (i < 10) {
                    let targetCell = row2Cells[9 - i];
                    targetCell.textContent = item.val;
                    sttCells[9 - i].textContent = item.stt;
                    
                    if (item.val < 5) {
                        targetCell.classList.add('bg-green');
                    } else {
                        targetCell.classList.add('bg-red');
                    }

                } else if (i < 20) {
                    let targetCell = row1Cells[9 - (i - 10)];
                    targetCell.textContent = item.val;
                    
                    if (item.val < 5) {
                        targetCell.classList.add('bg-green');
                    } else {
                        targetCell.classList.add('bg-red');
                    }
                }
            }

            // Chạy logic kiểm tra gợi ý dựa theo Cột 1 và Cột 2 từ trái qua
            checkPrediction();

            inputEl.value = '';
        });

        function checkPrediction() {
            // Lấy nội dung của Cột 1 (Chỉ số 0) và Cột 2 (Chỉ số 1) từ trái qua
            let r1_c1 = row1Cells[0].textContent; // Hàng 1 cột 1
            let r2_c1 = row2Cells[0].textContent; // Hàng 2 cột 1 (MỐC)
            let r1_c2 = row1Cells[1].textContent; // Hàng 1 cột 2
            let r2_c2 = row2Cells[1].textContent; // Hàng 2 cột 2

            // Đợi dữ liệu điền đủ vào 4 ô này
            if (r1_c1 === "" || r2_c1 === "" || r1_c2 === "" || r2_c2 === "") {
                setPredictBox("Chờ...", "default");
                return;
            }

            let n1_r1 = parseInt(r1_c1);
            let n1_r2 = parseInt(r2_c1); // Mốc so sánh
            let n2_r1 = parseInt(r1_c2);
            let n2_r2 = parseInt(r2_c2);

            // Hàm kiểm tra tính chất ngược nhau (Lớn/Nhỏ đối lập)
            function isOpposite(a, b) {
                return (a < 5 && b >= 5) || (a >= 5 && b < 5);
            }

            let col1Nguerk = isOpposite(n1_r1, n1_r2);
            let col2Nguerk = isOpposite(n2_r1, n2_r2);

            // Xác định trạng thái của ô mốc (Hàng 2, Cột 1)
            let baseStatus = (n1_r2 < 5) ? "Nhỏ" : "Lớn";

            // LOGIC QUY ĐỊNH GỢI Ý ĐÚNG THEO VỊ TRÍ
            if (col1Nguerk && col2Nguerk) {
                // Cả 2 cột đều ngược -> TRÙNG tính chất ô mốc
                if (baseStatus === "Nhỏ") {
                    setPredictBox("Gợi ý: Nhỏ", "green");
                } else {
                    setPredictBox("Gợi ý: Lớn", "red");
                }
            } else if ((col1Nguerk && !col2Nguerk) || (!col1Nguerk && col2Nguerk)) {
                // Chỉ có 1 cột ngược -> NGƯỢC tính chất ô mốc
                if (baseStatus === "Nhỏ") {
                    setPredictBox("Gợi ý: Lớn", "red");
                } else {
                    setPredictBox("Gợi ý: Nhỏ", "green");
                }
            } else {
                // Cả 2 cột đều không ngược
                setPredictBox("Chờ...", "default");
            }
        }

        function setPredictBox(text, status) {
            predictBox.textContent = text;
            predictBox.className = "prediction-box"; 
            
            if (status === "green") {
                predictBox.classList.add("bg-green");
                predictBox.style.border = "2px solid #00FF66";
            } else if (status === "red") {
                predictBox.classList.add("bg-red");
                predictBox.style.border = "2px solid #FF3333";
            } else {
                predictBox.style.backgroundColor = "#1A1A1A";
                predictBox.style.color = "#ffffff";
                predictBox.style.border = "2px dashed #555";
            }
        }

        function clearGrid() {
            for (let i = 0; i < 10; i++) {
                sttCells[i].textContent = '';
                row1Cells[i].textContent = '';
                row1Cells[i].className = 'cell'; 
                row2Cells[i].textContent = '';
                row2Cells[i].className = 'cell'; 
            }
        }
    </script>

</body>
</html>
