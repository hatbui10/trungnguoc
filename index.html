<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Số Tự Động - Có Nút Undo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 15px;
            background-color: #0A0A0A; 
            color: #ffffff;
            margin: 0;
        }

        /* Ô gợi ý nằm trên cùng */
        .prediction-box {
            width: calc(100% - 24px);
            max-width: 356px;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 12px;
            background-color: #1A1A1A;
            border: 2px dashed #555;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            box-sizing: border-box;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        /* Hộp chứa bảng số */
        .container {
            background: #121212; 
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            margin-bottom: 20px;
            max-width: 100%;
            box-sizing: border-box;
        }

        .matrix-grid {
            display: flex;
            flex-direction: column;
            gap: 6px; 
        }

        .row {
            display: flex;
            gap: 4px; 
        }

        /* Hàng STT nổi màu Tím Đậm */
        .row-stt {
            position: sticky;
            top: 5px;
            z-index: 10;
            margin-bottom: 6px; 
        }

        .row-stt .cell {
            background-color: #1A0044;
            color: #E0AAFF; 
            font-weight: bold;
            border: 1px solid #3A0088;
        }

        /* Ô tiêu chuẩn để thẳng hàng tuyệt đối */
        .cell {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #262626;
            border-radius: 6px;
            background-color: #1A1A1A; 
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            box-sizing: border-box; 
            transition: all 0.1s ease;
        }

        @media screen and (max-width: 360px) {
            .matrix-grid { gap: 4px; }
            .row { gap: 3px; }
            .cell { width: 28px; height: 28px; font-size: 12px; }
            .prediction-box { font-size: 16px; padding: 12px; }
        }

        .row-1 .cell {
            background-color: #161616;
        }

        /* MÀU NỀN CÁC Ô TƯƠNG PHẢN CAO */
        .bg-green {
            background-color: #00FF66 !important; 
            color: #000000 !important;
            border-color: #00FF66 !important;
        }

        .bg-red {
            background-color: #FF3333 !important; 
            color: #ffffff !important;
            border-color: #FF3333 !important;
        }

        /* Khu vực điều khiển và nhập liệu */
        .input-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 0 15px;
            box-sizing: border-box;
        }

        input {
            width: 100%;
            max-width: 220px;
            padding: 12px;
            font-size: 16px; 
            background-color: #1A1A1A;
            color: #ffffff;
            border: 2px solid #00E5FF; 
            border-radius: 24px;
            text-align: center;
            outline: none;
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.2);
        }
        
        input:focus {
            border-color: #00FF66;
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.4);
        }

        /* Nút Undo thiết kế tối giản, hợp giao diện */
        .btn-undo {
            background-color: #262626;
            color: #ffffff;
            border: 1px solid #444;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: background-color 0.2s;
        }

        .btn-undo:active {
            background-color: #444;
        }
    </style>
</head>
<body>

    <div class="prediction-box" id="predictionBox">Chờ dữ liệu...</div>

    <div class="container">
        <div class="matrix-grid">
            <div class="row row-stt" id="rowSTT">
                <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            </div>

            <div class="row row-1" id="row1">
                <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            </div>
            
            <div class="row row-2" id="row2">
                <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            </div>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="numberInput" pattern="[0-9]*" inputmode="numeric" placeholder="Gõ số tại đây..." autofocus maxlength="1">
        <button class="btn-undo" id="undoBtn">Hoàn tác (Undo)</button>
    </div>

    <script>
        let dataStorage = []; 
        let totalCount = 0;   

        const inputEl = document.getElementById('numberInput');
        const predictBox = document.getElementById('predictionBox');
        const undoBtn = document.getElementById('undoBtn');
        const sttCells = document.getElementById('rowSTT').children;
        const row1Cells = document.getElementById('row1').children;
        const row2Cells = document.getElementById('row2').children;

        window.addEventListener('DOMContentLoaded', () => {
            inputEl.focus();
        });

        // Hàm vẽ lại toàn bộ bảng dựa theo mảng dataStorage hiện có
        function renderGrid() {
            clearGrid();

            for (let i = 0; i < dataStorage.length; i++) {
                let reverseIndex = dataStorage.length - 1 - i;
                let item = dataStorage[reverseIndex];

                if (i < 10) {
                    let targetCell = row2Cells[9 - i];
                    targetCell.textContent = item.val;
                    sttCells[9 - i].textContent = item.stt;
                    
                    if (item.val < 5) {
                        targetCell.classList.add('bg-green');
                    } else {
                        targetCell.classList.add('bg-red');
                    }

                } else if (i < 20) {
                    let targetCell = row1Cells[9 - (i - 10)];
                    targetCell.textContent = item.val;
                    
                    if (item.val < 5) {
                        targetCell.classList.add('bg-green');
                    } else {
                        targetCell.classList.add('bg-red');
                    }
                }
            }

            // Tính toán lại gợi ý sau khi bảng thay đổi dữ liệu
            checkPrediction();
        }

        // Sự kiện gõ số tự động nhập dịch chuyển
        inputEl.addEventListener('input', function() {
            let value = inputEl.value.trim();

            if (!/^\d$/.test(value)) {
                inputEl.value = '';
                return;
            }

            dataStorage.push({
                stt: totalCount,
                val: parseInt(value)
            });

            totalCount++; 

            if (dataStorage.length > 20) {
                dataStorage.shift(); 
            }

            renderGrid();
            inputEl.value = '';
        });

        // Sự kiện click nút Undo (Hoàn tác)
        undoBtn.addEventListener('click', function() {
            if (dataStorage.length === 0) return;

            // Xóa phần tử cuối cùng vừa thêm vào mảng
            dataStorage.pop();
            
            // Giảm bộ đếm STT tổng xuống 1 đơn vị
            if (totalCount > 0) totalCount--;

            // Vẽ lại bảng số và tính toán lại gợi ý
            renderGrid();
            
            // Đưa con trỏ chuột quay lại ô nhập số để sẵn sàng gõ tiếp
            inputEl.focus();
        });

        function checkPrediction() {
            let r1_c1 = row1Cells[0].textContent; 
            let r2_c1 = row2Cells[0].textContent; 
            let r1_c2 = row1Cells[1].textContent; 
            let r2_c2 = row2Cells[1].textContent; 

            if (r1_c1 === "" || r2_c1 === "" || r1_c2 === "" || r2_c2 === "") {
                setPredictBox("Chờ...", "default");
                return;
            }

            let n1_r1 = parseInt(r1_c1);
            let n1_r2 = parseInt(r2_c1); 
            let n2_r1 = parseInt(r1_c2);
            let n2_r2 = parseInt(r2_c2);

            function isOpposite(a, b) {
                return (a < 5 && b >= 5) || (a >= 5 && b < 5);
            }

            let col1Nguerk = isOpposite(n1_r1, n1_r2);
            let col2Nguerk = isOpposite(n2_r1, n2_r2);

            let baseStatus = (n1_r2 < 5) ? "Nhỏ" : "Lớn";

            if (col1Nguerk && col2Nguerk) {
                if (baseStatus === "Nhỏ") {
                    setPredictBox("Gợi ý: Nhỏ", "green");
                } else {
                    setPredictBox("Gợi ý: Lớn", "red");
                }
            } else if ((col1Nguerk && !col2Nguerk) || (!col1Nguerk && col2Nguerk)) {
                if (baseStatus === "Nhỏ") {
                    setPredictBox("Gợi ý: Lớn", "red");
                } else {
                    setPredictBox("Gợi ý: Nhỏ", "green");
                }
            } else {
                setPredictBox("Chờ...", "default");
            }
        }

        function setPredictBox(text, status) {
            predictBox.textContent = text;
            predictBox.className = "prediction-box"; 
            
            if (status === "green") {
                predictBox.classList.add("bg-green");
                predictBox.style.border = "2px solid #00FF66";
            } else if (status === "red") {
                predictBox.classList.add("bg-red");
                predictBox.style.border = "2px solid #FF3333";
            } else {
                predictBox.style.backgroundColor = "#1A1A1A";
                predictBox.style.color = "#ffffff";
                predictBox.style.border = "2px dashed #555";
            }
        }

        function clearGrid() {
            for (let i = 0; i < 10; i++) {
                sttCells[i].textContent = '';
                row1Cells[i].textContent = '';
                row1Cells[i].className = 'cell'; 
                row2Cells[i].textContent = '';
                row2Cells[i].className = 'cell'; 
            }
        }
    </script>

</body>
</html>
