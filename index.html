<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Số Tự Động </title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 80px; 
            background-color: #0A0A0A; 
            color: #ffffff;
            margin: 0;
        }

        /* Ô gợi ý cố định trên cùng */
        .prediction-box {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 400px;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            box-sizing: border-box;
            letter-spacing: 1px;
            z-index: 9999;
            background-color: #1A1A1A;
            border-bottom: 2px dashed #555;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
        }

        /* Hộp chứa bảng số */
        .container {
            background: #121212; 
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            margin-bottom: 20px;
            max-width: 100%;
            box-sizing: border-box;
        }

        .matrix-grid {
            display: flex;
            flex-direction: column;
            gap: 6px; 
        }

        .row {
            display: flex;
            gap: 4px; 
        }

        .row-stt .cell {
            background-color: #1A0044;
            color: #E0AAFF; 
            font-weight: bold;
            border: 1px solid #3A0088;
        }

        .cell {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #262626;
            border-radius: 6px;
            background-color: #1A1A1A; 
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            box-sizing: border-box; 
            transition: all 0.1s ease;
        }

        @media screen and (max-width: 360px) {
            .matrix-grid { gap: 4px; }
            .row { gap: 3px; }
            .cell { width: 28px; height: 28px; font-size: 12px; }
            .prediction-box { font-size: 16px; padding: 12px; }
            body { padding-top: 70px; }
        }

        .row-1 .cell {
            background-color: #161616;
        }

        .bg-green {
            background-color: #00FF66 !important; 
            color: #000000 !important;
            border-color: #00FF66 !important;
        }

        .bg-red {
            background-color: #FF3333 !important; 
            color: #ffffff !important;
            border-color: #FF3333 !important;
        }

        .input-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 0 15px;
            box-sizing: border-box;
        }

        input {
            width: 100%;
            max-width: 220px;
            padding: 12px;
            font-size: 16px; 
            background-color: #1A1A1A;
            color: #ffffff;
            border: 2px solid #00E5FF; 
            border-radius: 24px;
            text-align: center;
            outline: none;
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.2);
        }
        
        input:focus {
            border-color: #00FF66;
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.4);
        }

        .btn-undo {
            background-color: #262626;
            color: #ffffff;
            border: 1px solid #444;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: background-color 0.2s;
        }

        .btn-undo:active {
            background-color: #444;
        }
    </style>
</head>
<body>

    <div class="prediction-box" id="predictionBox">Chờ dữ liệu...</div>

    <div class="container">
        <div class="matrix-grid">
            <div class="row row-stt" id="rowSTT">
                <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            </div>

            <div class="row row-1" id="row1">
                <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            </div>
            
            <div class="row row-2" id="row2">
                <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            </div>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="numberInput" pattern="[0-9]*" inputmode="numeric" placeholder="Gõ số tại đây..." autofocus maxlength="1">
        <button class="btn-undo" id="undoBtn">Hoàn tác (Undo)</button>
    </div>

    <script>
        let dataStorage = []; 
        let totalCount = 0;   

        const inputEl = document.getElementById('numberInput');
        const predictBox = document.getElementById('predictionBox');
        const undoBtn = document.getElementById('undoBtn');
        const sttCells = document.getElementById('rowSTT').children;
        const row1Cells = document.getElementById('row1').children;
        const row2Cells = document.getElementById('row2').children;

        window.addEventListener('DOMContentLoaded', () => {
            inputEl.focus();
        });

        function renderGrid() {
            clearGrid();

            for (let i = 0; i < dataStorage.length; i++) {
                let reverseIndex = dataStorage.length - 1 - i;
                let item = dataStorage[reverseIndex];

                if (i < 10) {
                    let targetCell = row2Cells[9 - i];
                    targetCell.textContent = item.val;
                    sttCells[9 - i].textContent = item.stt;
                    
                    if (item.val < 5) {
                        targetCell.classList.add('bg-green');
                    } else {
                        targetCell.classList.add('bg-red');
                    }

                } else if (i < 20) {
                    let targetCell = row1Cells[9 - (i - 10)];
                    targetCell.textContent = item.val;
                    
                    if (item.val < 5) {
                        targetCell.classList.add('bg-green');
                    } else {
                        targetCell.classList.add('bg-red');
                    }
                }
            }

            checkPrediction();
        }

        inputEl.addEventListener('input', function() {
            let value = inputEl.value.trim();

            if (!/^\d$/.test(value)) {
                inputEl.value = '';
                return;
            }

            dataStorage.push({
                stt: totalCount,
                val: parseInt(value)
            });

            totalCount++; 

            if (dataStorage.length > 20) {
                dataStorage.shift(); 
            }

            renderGrid();
            inputEl.value = '';
        });

        undoBtn.addEventListener('click', function() {
            if (dataStorage.length === 0) return;
            dataStorage.pop();
            if (totalCount > 0) totalCount--;
            renderGrid();
            inputEl.focus();
        });

        function checkPrediction() {
            // SỬA ĐỔI QUAN TRỌNG: Lấy trực tiếp theo vị trí vật lý trên màn hình hiển thị
            // Ô đầu tiên bên TRÁI giao diện luôn là chỉ số [0]
            let valLeft_r2 = row2Cells[0].textContent; 

            // Hai cột cuối cùng bên PHẢI giao diện luôn là chỉ số [8] (cột sát cuối) và [9] (cột cuối cùng)
            let valC8_r1 = row1Cells[8].textContent; 
            let valC8_r2 = row2Cells[8].textContent; 
            
            let valC9_r1 = row1Cells[9].textContent; 
            let valC9_r2 = row2Cells[9].textContent; 

            // Kiểm tra xem bảng đã điền đủ dữ liệu đến các vị trí này chưa
            if (valLeft_r2 === "" || valC8_r1 === "" || valC8_r2 === "" || valC9_r1 === "" || valC9_r2 === "") {
                setPredictBox("Chờ...", "default");
                return;
            }

            let n_base = parseInt(valLeft_r2);
            let n8_r1 = parseInt(valC8_r1);
            let n8_r2 = parseInt(valC8_r2);
            let n9_r1 = parseInt(valC9_r1);
            let n9_r2 = parseInt(valC9_r2);

            // Hàm kiểm tra tính chất ngược màu trong cùng một cột
            function isColumnDifferentColor(a, b) {
                return (a < 5 && b >= 5) || (a >= 5 && b < 5);
            }

            let col8IsDifferent = isColumnDifferentColor(n8_r1, n8_r2); // Cột kế cuối bên phải ngược màu
            let col9IsDifferent = isColumnDifferentColor(n9_r1, n9_r2); // Cột cuối cùng bên phải ngược màu

            // Tính chất thực tế (Lớn/Nhỏ) của ô mốc đầu tiên hàng 2 bên trái
            let baseStatus = (n_base < 5) ? "Nhỏ" : "Lớn";

            // THỰC THI LOGIC:
            // Nếu cả 2 cột bên phải đều ngược màu -> Gợi ý TRÙNG tính chất với ô hàng 2 ngoài cùng bên trái
            if (col8IsDifferent && col9IsDifferent) {
                if (baseStatus === "Nhỏ") {
                    setPredictBox("Gợi ý: Nhỏ", "green");
                } else {
                    setPredictBox("Gợi ý: Lớn", "red");
                }
            } 
            // Ngược lại -> Gợi ý NGƯỢC LẠI tính chất với ô đó
            else {
                if (baseStatus === "Nhỏ") {
                    setPredictBox("Gợi ý: Lớn", "red");
                } else {
                    setPredictBox("Gợi ý: Nhỏ", "green");
                }
            }
        }

        function setPredictBox(text, status) {
            predictBox.textContent = text;
            predictBox.className = "prediction-box"; 
            
            if (status === "green") {
                predictBox.classList.add("bg-green");
                predictBox.style.borderBottom = "2px solid #00FF66";
            } else if (status === "red") {
                predictBox.classList.add("bg-red");
                predictBox.style.borderBottom = "2px solid #FF3333";
            } else {
                predictBox.style.backgroundColor = "#1A1A1A";
                predictBox.style.color = "#ffffff";
                predictBox.style.borderBottom = "2px dashed #555";
            }
        }

        function clearGrid() {
            for (let i = 0; i < 10; i++) {
                sttCells[i].textContent = '';
                row1Cells[i].textContent = '';
                row1Cells[i].className = 'cell'; 
                row2Cells[i].textContent = '';
                row2Cells[i].className = 'cell'; 
            }
        }
    </script>

</body>
</html>
